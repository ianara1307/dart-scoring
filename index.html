<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dart Scoring</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- SETUP SCREEN -->
  <section id="setup-screen" class="screen active">
    <div class="setup-header">
      <h1>🎯 Dart Scoring</h1>
      <button id="stats-nav-btn" class="icon-btn" title="Stats & History">📊</button>
    </div>

    <div class="setup-row">
      <label>Game Type</label>
      <div class="toggle-group" id="game-type-toggle">
        <button class="toggle-btn active" data-value="501">501</button>
        <button class="toggle-btn" data-value="301">301</button>
      </div>
    </div>

    <div class="setup-row">
      <label>Out Mode</label>
      <div class="toggle-group" id="out-mode-toggle">
        <button class="toggle-btn active" data-value="double">Double Out</button>
        <button class="toggle-btn" data-value="straight">Straight Out</button>
      </div>
    </div>

    <div class="setup-row">
      <label>Score Input</label>
      <div class="toggle-group" id="input-mode-toggle">
        <button class="toggle-btn active" data-value="dart">Dart by Dart</button>
        <button class="toggle-btn" data-value="total">Total Throw Score</button>
      </div>
    </div>

    <div class="setup-row">
      <label>Players</label>
      <div id="player-list"></div>
      <button id="add-player-btn" class="secondary-btn">+ Add Player</button>
    </div>

    <button id="start-game-btn" class="primary-btn">Start Game</button>
  </section>

  <!-- GAME SCREEN -->
  <section id="game-screen" class="screen">
    <div class="game-header">
      <span id="game-title"></span>
      <div class="header-actions">
        <button id="mic-btn" class="icon-btn" title="Voice input">🎤</button>
        <button id="quit-game-btn" class="icon-btn">✕</button>
      </div>
    </div>

    <div id="voice-feedback" class="voice-feedback"></div>

    <div id="scoreboard"></div>

    <div id="checkout-suggestion" class="checkout-box" style="display:none;">
      <span class="checkout-label">Checkout:</span>
      <span id="checkout-text"></span>
    </div>

    <div id="current-turn-info">
      <div id="active-player-name"></div>
      <div id="dart-marks">
        <span class="dart-mark" data-idx="0"></span>
        <span class="dart-mark" data-idx="1"></span>
        <span class="dart-mark" data-idx="2"></span>
      </div>
      <div id="turn-total">Turn total: 0</div>
    </div>

    <!-- DART BY DART PAD -->
    <div id="entry-pad">
      <div class="multiplier-row">
        <button class="mult-btn active" data-mult="1">Single</button>
        <button class="mult-btn" data-mult="2">Double</button>
        <button class="mult-btn" data-mult="3">Treble</button>
      </div>
      <div class="number-grid" id="number-grid"></div>
      <div class="special-row">
        <button class="num-btn special" data-special="bull25">25</button>
        <button class="num-btn special" data-special="bull50">Bull 50</button>
        <button class="num-btn special" data-special="miss">Miss</button>
      </div>
      <div class="action-row">
        <button id="undo-btn" class="secondary-btn">Undo</button>
        <button id="end-turn-btn" class="primary-btn">End Turn</button>
      </div>
    </div>

    <!-- TOTAL SCORE PAD -->
    <div id="total-score-pad" style="display:none;">
      <div class="total-input-wrap">
        <input type="number" id="total-score-input" min="0" max="180" placeholder="Enter score...">
        <button id="total-score-submit" class="primary-btn">Score</button>
      </div>
    </div>
  </section>

  <!-- WIN SCREEN -->
  <section id="win-screen" class="screen">
    <h1>🏆 <span id="winner-name"></span> Wins!</h1>
    <div id="win-stats"></div>
    <button id="rematch-btn" class="primary-btn">Rematch</button>
    <button id="new-game-btn" class="secondary-btn">New Game</button>
    <button id="win-stats-nav-btn" class="secondary-btn">📊 View Stats</button>
  </section>

  <!-- STATS SCREEN -->
  <section id="stats-screen" class="screen">
    <div class="game-header">
      <span>📊 Stats &amp; History</span>
      <div class="header-actions">
        <button id="stats-back-btn" class="icon-btn">✕</button>
      </div>
    </div>

    <div id="stats-empty" class="stats-empty" style="display:none;">
      No games recorded yet — finish a leg to start building stats.
    </div>

    <div id="stats-content" style="display:none;">
      <div class="setup-row">
        <label>Player</label>
        <div class="toggle-group wrap" id="stats-player-toggle"></div>
      </div>

      <div id="stats-summary" class="stats-summary-grid"></div>

      <div class="chart-card">
        <div class="chart-card-title">3-Dart Average Trend</div>
        <div id="trend-chart-wrap"></div>
      </div>

      <div class="setup-row">
        <label>Recent Matches</label>
        <div id="match-history-list"></div>
      </div>

      <button id="clear-history-btn" class="secondary-btn">Clear History</button>
    </div>
  </section>

</div>

<!-- TURN SUMMARY MODAL -->
<div id="turn-modal" class="modal-overlay">
  <div class="modal-box">
    <div id="modal-title"></div>
    <div id="modal-darts"></div>
    <div id="modal-total"></div>
    <div class="modal-action-row">
      <button id="modal-edit-btn" class="secondary-btn">Edit</button>
      <button id="modal-continue-btn" class="primary-btn">Continue</button>
    </div>
  </div>
</div>

<!-- DART COUNT MODAL (checkout in total-score mode) -->
<div id="dart-count-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-title">How many darts to checkout?</div>
    <div id="dart-count-row">
      <button class="dart-count-btn" data-count="1">1</button>
      <button class="dart-count-btn" data-count="2">2</button>
      <button class="dart-count-btn" data-count="3">3</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
